<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <script src="/nav.js"></script>

  <div class="container my-4" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Notifications</h1>
      <button id="readAll" class="btn btn-outline-secondary btn-sm">Mark all as read</button>
    </div>
    <ul id="list" class="list-group shadow-sm"></ul>
    <p class="text-muted small mt-2">Click a notification to open it. Resting your mouse on one for a moment marks it as read.</p>
  </div>

  <script>
    function refreshBadge() {
      fetch('/api/notifications/unread-count')
        .then(r => r.json())
        .then(d => {
          const badge = document.getElementById('notifBadge');
          if (!badge) return;
          if (d.count > 0) {
            badge.textContent = d.count;
            badge.classList.remove('d-none');
          } else {
            badge.classList.add('d-none');
          }
        });
    }

    async function markRead(n, li) {
      if (n.is_read) return;
      n.is_read = 1;
      li.querySelector('.msg').className = 'msg text-muted';
      const tag = li.querySelector('.new-tag');
      if (tag) tag.remove();
      await fetch('/api/notifications/' + n.notification_id + '/read', { method: 'POST' });
      refreshBadge();
    }

    async function loadNotifications() {
      const res = await fetch('/api/notifications');
      if (!res.ok) { window.location.href = '/'; return; }
      const rows = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';

      if (rows.length === 0) {
        const li = document.createElement('li');
        li.className = 'list-group-item text-muted';
        li.textContent = 'No notifications yet.';
        list.appendChild(li);
        return;
      }

      rows.forEach(n => {
        const li = document.createElement('li');
        li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-start';
        li.style.cursor = 'pointer';

        const left = document.createElement('div');
        const msg = document.createElement('div');
        msg.className = n.is_read ? 'msg text-muted' : 'msg fw-semibold';
        msg.textContent = n.message;
        const when = document.createElement('small');
        when.className = 'text-muted';
        when.textContent = n.date_created;
        left.appendChild(msg);
        left.appendChild(when);
        li.appendChild(left);

        if (!n.is_read) {
          const tag = document.createElement('span');
          tag.className = 'badge bg-primary new-tag';
          tag.textContent = 'New';
          li.appendChild(tag);
        }

        let timer = null;
        li.addEventListener('mouseenter', () => {
          if (!n.is_read) timer = setTimeout(() => markRead(n, li), 600);
        });
        li.addEventListener('mouseleave', () => clearTimeout(timer));

        li.addEventListener('click', async () => {
          clearTimeout(timer);
          await markRead(n, li);
          if (n.link && n.link.startsWith('/') && !n.link.startsWith('//')) {
            window.location.href = n.link;
          }
        });

        list.appendChild(li);
      });
    }

    document.getElementById('readAll').addEventListener('click', async () => {
      await fetch('/api/notifications/read-all', { method: 'POST' });
      await loadNotifications();
      refreshBadge();
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    loadNotifications();
  </script>
</body>
</html>
