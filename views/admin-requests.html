<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Document Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <script src="/adminnav.js"></script>

  <div class="container-fluid my-4 px-4">
    <h1 class="h4 mb-1">Document Requests</h1>
    <p class="text-muted small">
      Pending, Processing, Ready for Pickup, Completed. Denial from Pending or Processing needs a note.
    </p>
    <div id="pageMessage" class="alert d-none"></div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="row g-2 mb-3">
              <div class="col-md-5">
                <input class="form-control" id="search" placeholder="Search name, email, document, purpose">
              </div>
              <div class="col-md-4">
                <select class="form-select" id="statusFilter">
                  <option value="all">All statuses</option>
                  <option>Pending</option>
                  <option>Processing</option>
                  <option>Ready for Pickup</option>
                  <option>Completed</option>
                  <option>Denied</option>
                  <option>Cancelled</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="sort">
                  <option value="action">Needs action first</option>
                  <option value="newest">Newest first</option>
                  <option value="oldest">Oldest first</option>
                </select>
              </div>
            </div>
            <div class="small text-muted mb-2" id="queueInfo"></div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr><th>Ref</th><th>Resident</th><th>Document</th><th>Status</th><th>Submitted</th></tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <div id="reviewEmpty" class="text-muted">Select a request from the list to review it.</div>

            <div id="reviewBody" class="d-none">
              <h2 class="h6" id="reviewTitle"></h2>
              <dl class="row small mb-3" id="reviewDetails"></dl>
              <div id="reviewMessage" class="alert d-none"></div>

              <form id="statusForm">
                <div class="mb-3">
                  <label class="form-label" for="nextStatus">Next status</label>
                  <select class="form-select" id="nextStatus"></select>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="note">Admin notes (visible to the resident)</label>
                  <textarea class="form-control" id="note" rows="3" maxlength="200"></textarea>
                  <div class="form-text" id="noteHint"></div>
                </div>
                <button class="btn btn-primary" type="submit">Save status &amp; notify</button>
              </form>
              <p id="closedNote" class="text-muted d-none mb-0">This request is closed. No further changes are possible.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = { requests: [], selectedId: null };

    const NEXT = {
      'Pending': ['Processing', 'Denied'],
      'Processing': ['Ready for Pickup', 'Denied'],
      'Ready for Pickup': ['Completed']
    };

    const ORDER = {
      'Pending': 0, 'Processing': 1, 'Ready for Pickup': 2,
      'Completed': 3, 'Denied': 4, 'Cancelled': 5
    };

    const statusClass = {
      'Pending': 'bg-warning text-dark',
      'Processing': 'bg-info text-dark',
      'Ready for Pickup': 'bg-primary',
      'Completed': 'bg-success',
      'Denied': 'bg-danger',
      'Cancelled': 'bg-secondary'
    };

    function ref(id) { return 'D-' + String(id).padStart(3, '0'); }

    function pageMessage(text, type) {
      const box = document.getElementById('pageMessage');
      box.textContent = text;
      box.className = 'alert alert-' + type;
    }

    function reviewMessage(text, type) {
      const box = document.getElementById('reviewMessage');
      box.textContent = text;
      box.className = 'alert alert-' + type;
    }

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text || '';
      return td;
    }

    function badge(status) {
      const span = document.createElement('span');
      span.className = 'badge ' + (statusClass[status] || 'bg-secondary');
      span.textContent = status;
      return span;
    }

    async function loadRequests() {
      const res = await fetch('/api/admin/requests');
      if (!res.ok) { window.location.href = '/'; return; }
      state.requests = await res.json();
      render();
      renderReview();
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const filter = document.getElementById('statusFilter').value;
      const sort = document.getElementById('sort').value;

      let rows = state.requests.filter(r => {
        const text = [ref(r.request_id), r.first_name, r.last_name, r.email, r.document_name, r.purpose]
          .join(' ').toLowerCase();
        return (!q || text.includes(q)) && (filter === 'all' || r.status === filter);
      });

      if (sort === 'newest') {
        rows.sort((a, b) => b.requested_at.localeCompare(a.requested_at) || b.request_id - a.request_id);
      } else if (sort === 'oldest') {
        rows.sort((a, b) => a.requested_at.localeCompare(b.requested_at) || a.request_id - b.request_id);
      } else {
        rows.sort((a, b) =>
          ORDER[a.status] - ORDER[b.status] ||
          a.requested_at.localeCompare(b.requested_at) ||
          a.request_id - b.request_id);
      }

      const pending = state.requests.filter(r => r.status === 'Pending').length;
      document.getElementById('queueInfo').textContent =
        'Showing ' + rows.length + ' of ' + state.requests.length + ' requests · ' + pending + ' pending';

      const body = document.getElementById('rows');
      body.innerHTML = '';

      if (rows.length === 0) {
        const tr = document.createElement('tr');
        const td = cell('No requests found.');
        td.colSpan = 5;
        td.className = 'text-muted';
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }

      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        if (r.request_id === state.selectedId) tr.className = 'table-active';

        tr.appendChild(cell(ref(r.request_id)));
        tr.appendChild(cell(r.last_name + ', ' + r.first_name));
        tr.appendChild(cell(r.document_name));

        const statusTd = document.createElement('td');
        statusTd.appendChild(badge(r.status));
        tr.appendChild(statusTd);

        tr.appendChild(cell(r.requested_at.slice(0, 16)));

        tr.addEventListener('click', () => {
          state.selectedId = r.request_id;
          document.getElementById('note').value = '';
          document.getElementById('reviewMessage').className = 'alert d-none';
          render();
          renderReview();
        });
        body.appendChild(tr);
      });
    }

    function addDetail(list, label, valueNode) {
        const dt = document.createElement('dt');
         dt.className = 'col-sm-4';
         dt.textContent = label;
         const dd = document.createElement('dd');
         dd.className = 'col-sm-8';
        if (valueNode instanceof Node) {
            dd.appendChild(valueNode);
        } else {
            dd.textContent = valueNode || '-';
  }
  
  list.appendChild(dt);
  list.appendChild(dd);
}

    function renderReview() {
      const r = state.requests.find(x => x.request_id === state.selectedId);
      document.getElementById('reviewEmpty').classList.toggle('d-none', !!r);
      document.getElementById('reviewBody').classList.toggle('d-none', !r);
      if (!r) return;

      document.getElementById('reviewTitle').textContent = ref(r.request_id) + ' · ' + r.document_name;

      const list = document.getElementById('reviewDetails');
      list.innerHTML = '';
      addDetail(list, 'Resident', r.first_name + ' ' + r.last_name);
      addDetail(list, 'Email', r.email);
      addDetail(list, 'Account', r.verification_status);
      addDetail(list, 'Purpose', r.purpose);
      addDetail(list, 'Submitted', r.requested_at.slice(0, 16));
      addDetail(list, 'Last updated', r.updated_at.slice(0, 16));
      addDetail(list, 'Status', badge(r.status));
      addDetail(list, 'Current note', r.admin_notes);

      const options = NEXT[r.status] || [];
      const form = document.getElementById('statusForm');
      form.classList.toggle('d-none', options.length === 0);
      document.getElementById('closedNote').classList.toggle('d-none', options.length !== 0);

      const select = document.getElementById('nextStatus');
      select.innerHTML = '';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choose the next status';
      placeholder.disabled = true;  
      placeholder.selected = true;  
      select.appendChild(placeholder);
      options.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });
      updateHint();
    }

    function updateHint() {
      const status = document.getElementById('nextStatus').value;
      document.getElementById('noteHint').textContent =
        status === 'Denied' ? 'A note is required when denying a request.' : 'Optional.';
    }

    document.getElementById('nextStatus').addEventListener('change', updateHint);

    document.getElementById('statusForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('nextStatus').value;
      const note = document.getElementById('note').value.trim();

      if (!status) { reviewMessage('Choose the next status.', 'danger'); return; }
      if (status === 'Denied' && !note) {
        reviewMessage('Enter a note explaining the denial.', 'danger');
        return;
      }

      try {
        const res = await fetch('/api/admin/requests/' + state.selectedId + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, note })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        pageMessage(data.message, 'success');
        document.getElementById('note').value = '';
        document.getElementById('reviewMessage').className = 'alert d-none';
        await loadRequests();
      } catch (err) {
        reviewMessage(err.message, 'danger');
      }
    });

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('sort').addEventListener('change', render);

    loadRequests();
  </script>
</body>
</html>
