<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <script src="/adminnav.js"></script>
  <div class="container mt-4">
    <h1 class="h4" id="welcome">Dashboard</h1>
    <p class="text-muted">Statistics and charts will be added here.</p>
  </div>

  <script>
    fetch('/api/me').then(r => r.json()).then(me => {
      document.getElementById('welcome').textContent = 'Admin dashboard · ' + me.email;
    });
  </script>
</body>
</html>
