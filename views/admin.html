<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">BarangayLink · Administration</span>
    <button id="logout" class="btn btn-outline-light btn-sm">Log out</button>
  </nav>
  <div class="container mt-4">
    <h1 class="h4" id="welcome">Dashboard</h1>
  </div>

  <script>
    fetch('/api/me').then(r => r.json()).then(me => {
      document.getElementById('welcome').textContent = 'Admin dashboard · ' + me.email;
    });
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
