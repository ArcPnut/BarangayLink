<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <script src="/adminnav.js"></script>

  <div class="container-fluid my-4 px-4">
    <h1 class="h4 mb-1" id="pageTitle"></h1>
    <p class="text-muted small" id="pageSubtitle"></p>

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item"><a class="nav-link" id="tabTypes" href="/admin/document-types">Document Types</a></li>
      <li class="nav-item"><a class="nav-link" id="tabFacilities" href="/admin/facilities">Facilities</a></li>
    </ul>

    <div id="pageMessage" class="alert d-none"></div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0" id="listTitle"></h2>
              <button class="btn btn-outline-primary btn-sm" id="addBtn"></button>
            </div>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr><th>Name</th><th class="cap-col">Capacity</th><th>State</th><th id="usageHead"></th><th>Actions</th></tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
            <p class="text-muted small mt-3 mb-0">
              Deactivating changes the catalog status only. Residents no longer see the item, and past records are kept.
            </p>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h6" id="formTitle"></h2>
            <div id="formMessage" class="alert d-none"></div>
            <form id="itemForm">
              <div class="mb-3">
                <label class="form-label" for="name" id="nameLabel"></label>
                <input class="form-control" id="name" maxlength="100" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="description" id="descLabel"></label>
                <textarea class="form-control" id="description" rows="3" maxlength="255"></textarea>
              </div>
              <div class="mb-3 cap-col">
                <label class="form-label" for="capacity">Capacity (optional)</label>
                <input class="form-control" id="capacity" type="number" min="1" max="10000" step="1">
              </div>
              <div class="mb-3">
                <label class="form-label" for="status">Catalog status</label>
                <select class="form-select" id="status">
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
              <button class="btn btn-primary" type="submit" id="saveBtn"></button>
              <button class="btn btn-outline-secondary" type="button" id="cancelBtn">Cancel</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const isFacilities = window.location.pathname === '/admin/facilities';

    const cfg = isFacilities ? {
      title: 'Facilities',
      subtitle: 'Manage the facilities residents can reserve.',
      api: '/api/admin/facilities',
      idKey: 'facility_id',
      nameKey: 'facility_name',
      noun: 'facility',
      addLabel: '+ Add facility',
      nameLabel: 'Facility name',
      descLabel: 'Description / equipment information',
      usageLabel: 'Reservations',
      saveLabel: 'Save facility'
    } : {
      title: 'Document Types',
      subtitle: 'Manage the documents residents can request.',
      api: '/api/admin/document-types',
      idKey: 'document_type_id',
      nameKey: 'document_name',
      noun: 'document type',
      addLabel: '+ Add document type',
      nameLabel: 'Document name',
      descLabel: 'Description',
      usageLabel: 'Requests',
      saveLabel: 'Save document type'
    };

    const state = { items: [], editingId: null };

    function el(id) { return document.getElementById(id); }

    function showMessage(box, text, type) {
      box.textContent = text;
      box.className = 'alert alert-' + type;
    }

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text === null || text === undefined ? '' : text;
      return td;
    }

    function setup() {
      el('pageTitle').textContent = cfg.title;
      el('pageSubtitle').textContent = cfg.subtitle;
      el('listTitle').textContent = cfg.title;
      el('addBtn').textContent = cfg.addLabel;
      el('nameLabel').textContent = cfg.nameLabel;
      el('descLabel').textContent = cfg.descLabel;
      el('usageHead').textContent = cfg.usageLabel;
      el('saveBtn').textContent = cfg.saveLabel;
      el('tabTypes').classList.toggle('active', !isFacilities);
      el('tabFacilities').classList.toggle('active', isFacilities);
      document.querySelectorAll('.cap-col').forEach(node => {
        node.classList.toggle('d-none', !isFacilities);
      });
      resetForm();
    }

    function resetForm() {
      state.editingId = null;
      el('formTitle').textContent = 'Add ' + cfg.noun;
      el('name').value = '';
      el('description').value = '';
      el('capacity').value = '';
      el('status').value = 'true';
      el('formMessage').className = 'alert d-none';
      render();
    }

    function startEdit(item) {
      state.editingId = item[cfg.idKey];
      el('formTitle').textContent = 'Edit: ' + item[cfg.nameKey];
      el('name').value = item[cfg.nameKey];
      el('description').value = item.description || '';
      el('capacity').value = item.capacity || '';
      el('status').value = item.is_active ? 'true' : 'false';
      el('formMessage').className = 'alert d-none';
      render();
      el('name').focus();
    }

    async function loadItems() {
      const res = await fetch(cfg.api);
      if (!res.ok) { window.location.href = '/'; return; }
      state.items = await res.json();
      render();
    }

    function render() {
      const body = el('rows');
      body.innerHTML = '';

      if (state.items.length === 0) {
        const tr = document.createElement('tr');
        const td = cell('Nothing here yet.');
        td.colSpan = 5;
        td.className = 'text-muted';
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }

      state.items.forEach(item => {
        const tr = document.createElement('tr');
        if (item[cfg.idKey] === state.editingId) tr.className = 'table-active';

        const nameTd = cell(item[cfg.nameKey]);
        nameTd.className = 'fw-semibold';
        tr.appendChild(nameTd);

        const capTd = cell(item.capacity);
        capTd.classList.add('cap-col');
        if (!isFacilities) capTd.classList.add('d-none');
        tr.appendChild(capTd);

        const stateTd = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (item.is_active ? 'bg-success' : 'bg-secondary');
        badge.textContent = item.is_active ? 'Active' : 'Inactive';
        stateTd.appendChild(badge);
        tr.appendChild(stateTd);

        tr.appendChild(cell(item.usage_count));

        const actionTd = document.createElement('td');
        const edit = document.createElement('button');
        edit.className = 'btn btn-outline-primary btn-sm me-1';
        edit.textContent = 'Edit';
        edit.addEventListener('click', () => startEdit(item));
        actionTd.appendChild(edit);

        const toggle = document.createElement('button');
        toggle.className = 'btn btn-sm ' + (item.is_active ? 'btn-outline-danger' : 'btn-outline-success');
        toggle.textContent = item.is_active ? 'Deactivate' : 'Activate';
        toggle.addEventListener('click', () => toggleActive(item));
        actionTd.appendChild(toggle);
        tr.appendChild(actionTd);

        body.appendChild(tr);
      });
    }

    async function toggleActive(item) {
      const makeActive = !item.is_active;
      const question = makeActive
        ? 'Activate "' + item[cfg.nameKey] + '"? Residents will see it again.'
        : 'Deactivate "' + item[cfg.nameKey] + '"? Residents will no longer see it. Past records are kept.';
      if (!confirm(question)) return;

      try {
        const res = await fetch(cfg.api + '/' + item[cfg.idKey] + '/active', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_active: makeActive })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        showMessage(el('pageMessage'), data.message, 'success');
        if (state.editingId === item[cfg.idKey]) resetForm();
        await loadItems();
      } catch (err) {
        showMessage(el('pageMessage'), err.message, 'danger');
      }
    }

    el('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        description: el('description').value,
        is_active: el('status').value === 'true'
      };
      body[cfg.nameKey] = el('name').value;
      if (isFacilities) body.capacity = el('capacity').value;

      const editing = state.editingId !== null;
      const url = editing ? cfg.api + '/' + state.editingId : cfg.api;

      try {
        const res = await fetch(url, {
          method: editing ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        showMessage(el('pageMessage'), data.message, 'success');
        await loadItems();
        resetForm();
      } catch (err) {
        showMessage(el('formMessage'), err.message, 'danger');
      }
    });

    el('addBtn').addEventListener('click', () => { resetForm(); el('name').focus(); });
    el('cancelBtn').addEventListener('click', resetForm);

    setup();
    loadItems();
  </script>
</body>
</html>
