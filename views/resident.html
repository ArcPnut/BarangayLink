<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Resident</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <span class="navbar-brand">BarangayLink</span>
    <div class="navbar-nav me-auto">
      <a class="nav-link active" href="/resident">Home</a>
      <a class="nav-link" href="/resident/profile">Profile</a>
      <a class="nav-link" href="/resident/requests">Requests</a>
    </div>
    <button id="logout" class="btn btn-outline-light btn-sm">Log out</button>
  </nav>
  <div class="container mt-4">
    <h1 class="h4" id="welcome">Welcome</h1>
    <p id="status" class="text-muted"></p>
  </div>

  <script>
    fetch('/api/me').then(r => r.json()).then(me => {
      document.getElementById('welcome').textContent = 'Welcome, ' + me.first_name + '!';
      document.getElementById('status').textContent = 'Account status: ' + me.verification_status;
    });
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
