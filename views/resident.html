<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <script src="/nav.js"></script>

  <div class="container my-4" style="max-width: 900px;">
    <h1 class="h4 mb-3" id="welcome">Welcome</h1>

    <div id="banner" class="alert d-none"></div>
    <div id="unread" class="alert alert-primary d-none"></div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h6">Request a document</h2>
            <p class="text-muted small">Barangay clearance, certificate of residency and more.</p>
            <a class="btn btn-primary btn-sm" href="/resident/requests">Request a document</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h6">Reserve a facility</h2>
            <p class="text-muted small">Check availability and book the covered court or meeting room.</p>
            <a class="btn btn-primary btn-sm" href="/resident/reservations">Reserve a facility</a>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <h2 class="h6">Latest document requests</h2>
              <a class="small" href="/resident/requests">View all</a>
            </div>
            <ul id="recentRequests" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <h2 class="h6">Upcoming reservations</h2>
              <a class="small" href="/resident/reservations">View all</a>
            </div>
            <ul id="upcoming" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const statusClass = {
      'Pending': 'bg-warning text-dark',
      'Processing': 'bg-info text-dark',
      'Ready for Pickup': 'bg-primary',
      'Completed': 'bg-success',
      'Approved': 'bg-success',
      'Denied': 'bg-danger',
      'Rejected': 'bg-danger',
      'Cancelled': 'bg-secondary'
    };

    function todayString() {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }

    function addRow(list, title, subtitle, status) {
      const li = document.createElement('li');
      li.className = 'list-group-item px-0 d-flex justify-content-between align-items-start';

      const left = document.createElement('div');
      const t = document.createElement('div');
      t.textContent = title;
      const s = document.createElement('small');
      s.className = 'text-muted';
      s.textContent = subtitle;
      left.appendChild(t);
      left.appendChild(s);

      const badge = document.createElement('span');
      badge.className = 'badge ' + (statusClass[status] || 'bg-secondary');
      badge.textContent = status;

      li.appendChild(left);
      li.appendChild(badge);
      list.appendChild(li);
    }

    function addEmpty(list, text) {
      const li = document.createElement('li');
      li.className = 'list-group-item px-0 text-muted';
      li.textContent = text;
      list.appendChild(li);
    }

    async function loadProfile() {
      const res = await fetch('/api/profile');
      if (!res.ok) { window.location.href = '/'; return; }
      const p = await res.json();

      document.getElementById('welcome').textContent = 'Welcome, ' + p.first_name + '!';

      const banner = document.getElementById('banner');
      banner.innerHTML = '';
      const profileLink = document.createElement('a');
      profileLink.href = '/resident/profile';
      profileLink.textContent = 'Profile tab';

      if (p.verification_status === 'Unverified') {
        banner.className = 'alert alert-warning';
        banner.append('Your account is not verified yet. Upload your ID in the ', profileLink,
          ' to request documents and reserve facilities.');
      } else if (p.verification_status === 'Pending') {
        banner.className = 'alert alert-info';
        banner.textContent = 'Your ID is waiting for admin review.';
      } else if (p.verification_status === 'Rejected') {
        banner.className = 'alert alert-danger';
        banner.append('Your ID was rejected' +
          (p.verification_remarks ? ': ' + p.verification_remarks + '. ' : '. ') +
          'Upload a new one in the ', profileLink, '.');
      } else {
        banner.className = 'alert alert-success';
        banner.textContent = 'Your account is verified.';
      }
    }

    async function loadRequests() {
      const list = document.getElementById('recentRequests');
      const res = await fetch('/api/requests');
      if (!res.ok) return;
      const rows = (await res.json()).slice(0, 3);
      if (rows.length === 0) { addEmpty(list, 'No requests yet.'); return; }
      rows.forEach(r => addRow(list, r.document_name, r.purpose, r.status));
    }

    async function loadReservations() {
      const list = document.getElementById('upcoming');
      const res = await fetch('/api/reservations');
      if (!res.ok) return;
      const today = todayString();
      const rows = (await res.json())
        .filter(r => (r.status === 'Pending' || r.status === 'Approved') && r.reservation_date >= today)
        .sort((a, b) => (a.reservation_date + a.start_time).localeCompare(b.reservation_date + b.start_time))
        .slice(0, 3);
      if (rows.length === 0) { addEmpty(list, 'No upcoming reservations.'); return; }
      rows.forEach(r => addRow(
        list,
        r.facility_name,
        r.reservation_date + ', ' + r.start_time + ' to ' + r.end_time,
        r.status
      ));
    }

    async function loadUnread() {
      const res = await fetch('/api/notifications/unread-count');
      if (!res.ok) return;
      const data = await res.json();
      if (data.count > 0) {
        const box = document.getElementById('unread');
        box.className = 'alert alert-primary';
        const link = document.createElement('a');
        link.href = '/resident/notifications';
        link.textContent = 'View notifications';
        box.append('You have ' + data.count + ' unread notification' + (data.count === 1 ? '' : 's') + '. ', link);
      }
    }

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    loadProfile();
    loadRequests();
    loadReservations();
    loadUnread();
  </script>
</body>
</html>
