<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <span class="navbar-brand">BarangayLink</span>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/resident">Home</a>
      <a class="nav-link active" href="/resident/profile">Profile</a>
      <a class="nav-link" href="/resident/requests">Requests</a>
    </div>
    <button id="logout" class="btn btn-outline-light btn-sm">Log out</button>
  </nav>

  <div class="container my-4" style="max-width: 720px;">
    <h1 class="h4 mb-3">My Profile</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h6">Verification</h2>
        <p>Status: <span id="statusBadge" class="badge bg-secondary">Loading</span></p>
        <div id="remarks" class="alert alert-danger d-none"></div>
        <div id="idMessage" class="alert d-none"></div>
        <form id="idForm">
          <label class="form-label" for="id_file">Upload a valid ID (JPG, PNG or PDF, up to 5 MB)</label>
          <input class="form-control mb-3" type="file" id="id_file" accept=".jpg,.jpeg,.png,.pdf" required>
          <button class="btn btn-primary" type="submit">Upload ID</button>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h6">Personal details</h2>
        <div id="message" class="alert d-none"></div>
        <form id="profileForm">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" readonly>
          </div>
          <div class="mb-3">
            <label class="form-label" for="birthdate">Birthdate</label>
            <input class="form-control" id="birthdate" readonly>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="first_name">First name</label>
              <input class="form-control" id="first_name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="last_name">Last name</label>
              <input class="form-control" id="last_name" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" id="address" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact_no">Contact number</label>
            <input class="form-control" id="contact_no">
          </div>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const badgeClass = {
      Unverified: 'bg-secondary',
      Pending: 'bg-warning text-dark',
      Verified: 'bg-success',
      Rejected: 'bg-danger'
    };

    function show(box, text, type) {
      box.textContent = text;
      box.className = 'alert alert-' + type;
    }

    async function loadProfile() {
      const res = await fetch('/api/profile');
      if (!res.ok) { window.location.href = '/'; return; }
      const p = await res.json();

      ['email', 'birthdate', 'first_name', 'last_name', 'address'].forEach(id => {
        document.getElementById(id).value = p[id] || '';
      });
      document.getElementById('contact_no').value = p.contact_no || '';

      const badge = document.getElementById('statusBadge');
      badge.textContent = p.verification_status;
      badge.className = 'badge ' + badgeClass[p.verification_status];

      const remarks = document.getElementById('remarks');
      if (p.verification_status === 'Rejected' && p.verification_remarks) {
        remarks.textContent = 'Reason: ' + p.verification_remarks;
        remarks.classList.remove('d-none');
      } else {
        remarks.classList.add('d-none');
      }

      document.getElementById('idForm').classList.toggle('d-none', p.verification_status === 'Verified');
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('message');
      try {
        const res = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            address: document.getElementById('address').value,
            contact_no: document.getElementById('contact_no').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        show(box, data.message, 'success');
      } catch (err) {
        show(box, err.message, 'danger');
      }
    });

    document.getElementById('idForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('idMessage');
      const form = new FormData();
      form.append('id_file', document.getElementById('id_file').files[0]);
      try {
        const res = await fetch('/api/profile/id', { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        show(box, data.message, 'success');
        document.getElementById('idForm').reset();
        loadProfile();
      } catch (err) {
        show(box, err.message, 'danger');
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });

    loadProfile();
  </script>
</body>
</html>
