<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 560px;">
    <h1 class="h3 text-center mt-5 mb-4">BarangayLink</h1>
    <div class="card shadow-sm mb-5">
      <div class="card-body">
        <h2 class="h5 mb-3">Create an account</h2>
        <div id="message" class="alert d-none"></div>
        <form id="registerForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="first_name">First name</label>
              <input class="form-control" id="first_name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="last_name">Last name</label>
              <input class="form-control" id="last_name" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="birthdate">Birthdate</label>
            <input class="form-control" type="date" id="birthdate" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" id="address" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact_no">Contact number (optional)</label>
            <input class="form-control" id="contact_no">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password (at least 8 characters)</label>
            <input class="form-control" type="password" id="password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="/">Log in</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('message');
      box.className = 'alert d-none';
      const ids = ['first_name', 'last_name', 'birthdate', 'address', 'contact_no', 'email', 'password'];
      const body = {};
      ids.forEach(id => { body[id] = document.getElementById(id).value; });
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        box.textContent = data.message;
        box.className = 'alert alert-success';
        setTimeout(() => { window.location.href = '/'; }, 1500);
      } catch (err) {
        box.textContent = err.message;
        box.className = 'alert alert-danger';
      }
    });
  </script>
</body>
</html>
