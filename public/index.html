<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 420px;">
    <h1 class="h3 text-center mt-5 mb-4">BarangayLink</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Log in</h2>
        <div id="message" class="alert alert-danger d-none" style="white-space: pre-line;"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-center mt-3 mb-0">No account? <a href="/register.html">Register</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('message');
      box.classList.add('d-none');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = data.redirect;
      } catch (err) {
        box.textContent = err.message;
        box.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
