<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BarangayLink | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --brand: #1d4ed8; --brand-dark: #1e3a8a; }
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bs-tertiary-bg); }

    .btn-primary {
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-bg: var(--brand-dark);
      --bs-btn-hover-border-color: var(--brand-dark);
      --bs-btn-active-bg: var(--brand-dark);
      --bs-btn-active-border-color: var(--brand-dark);
      --bs-btn-disabled-bg: var(--brand);
      --bs-btn-disabled-border-color: var(--brand);
    }

    .pinned-bar {
      background: var(--bs-warning-bg-subtle);
      color: var(--bs-warning-text-emphasis);
      border-bottom: 1px solid var(--bs-warning-border-subtle);
    }
    .pinned-bar .inner {
      max-width: 1320px; margin: 0 auto;
      padding: .6rem 7.5rem .6rem 1rem;
      display: flex; gap: .6rem; align-items: flex-start; font-size: .9rem;
    }

    .brand-panel {
      background: linear-gradient(160deg, var(--brand-dark) 0%, var(--brand) 100%);
      color: #fff; border-radius: 1rem; padding: 2rem; height: 100%;
      display: flex; flex-direction: column; justify-content: center; gap: 1.5rem;
    }
    .brand-mark {
      width: 44px; height: 44px; border-radius: .75rem; flex: none;
      background: rgba(255, 255, 255, .16); display: grid; place-items: center; font-size: 1.5rem;
    }
    .brand-panel h1 { font-size: 1.6rem; font-weight: 600; margin: 0; }
    .brand-sub { opacity: .85; font-size: .9rem; }

    .login-card {
      background: var(--bs-body-bg); color: var(--bs-body-color);
      border-radius: .9rem; padding: 1.5rem; box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .18);
    }
    .perks { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; font-size: .85rem; opacity: .9; }
    .perks i { margin-right: .35rem; }

    .board-panel {
      background: var(--bs-body-bg); border: 1px solid var(--bs-border-color);
      border-radius: 1rem; padding: 1.5rem; height: 100%;
    }
    .section-title {
      font-size: .8rem; font-weight: 500; color: var(--bs-secondary-color);
      display: flex; align-items: center; gap: .4rem; margin-bottom: .25rem;
    }
  </style>
</head>
<body>

  <div id="pinnedBar" class="pinned-bar d-none" role="status">
    <div class="inner">
      <i class="bi bi-pin-angle-fill"></i>
      <span id="pinnedText"></span>
    </div>
  </div>

  <main class="container-xl py-4 py-lg-5">
    <div class="row g-4 align-items-stretch">

      <div class="col-lg-5">
        <div class="brand-panel">
          <div>
            <div class="d-flex align-items-center gap-3">
              <div class="brand-mark"><i class="bi bi-buildings"></i></div>
              <h1>BarangayLink</h1>
            </div>
          </div>

          <div class="login-card">
            <h2 class="h5 mb-3">Log in</h2>
            <div id="message" class="alert alert-danger d-none" style="white-space: pre-line;"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" autocomplete="current-password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Log in</button>
            </form>
            <p class="text-center mt-3 mb-0 small">No account? <a href="/register.html">Register</a></p>
          </div>

          <div class="perks">
            <span><i class="bi bi-file-earmark-text"></i>Request documents</span>
            <span><i class="bi bi-calendar-check"></i>Reserve facilities</span>
            <span><i class="bi bi-bell"></i>Track every update</span>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="board-panel">
          <h2 class="h5 mb-3">From the barangay</h2>
          <div class="row g-4">
            <div class="col-md-6">
              <div class="section-title"><i class="bi bi-megaphone"></i>Announcements</div>
              <div id="announcementsBox"><div class="text-body-secondary small py-2">Loading...</div></div>
            </div>
            <div class="col-md-6">
              <div class="section-title"><i class="bi bi-calendar-event"></i>Upcoming events</div>
              <div id="eventsBox"><div class="text-body-secondary small py-2">Loading...</div></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center small text-body-secondary pb-4 px-3" id="hallLine"></footer>

  <script src="/errors.js"></script>
  <script src="/site-config.js"></script>
  <script src="/board.js"></script>
  <script>
    const SITE = window.SITE || { hall: {} };
    const hallBits = [SITE.hall && SITE.hall.hours, SITE.hall && SITE.hall.phone].filter(Boolean);
    document.getElementById('hallLine').textContent =
      hallBits.length ? 'Barangay hall: ' + hallBits.join('  ·  ') : '';

    if (new URLSearchParams(window.location.search).has('expired')) {
      const note = document.getElementById('message');
      note.textContent = 'Your session has ended. Please log in again.';
      note.classList.remove('d-none');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('message');
      box.classList.add('d-none');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        window.location.href = data.redirect;
      } catch (err) {
        box.textContent = err.message;
        box.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
